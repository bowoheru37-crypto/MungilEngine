<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Archipelago Drift — MungilEngine V13 Playable Build</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111827; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    .hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; pointer-events: none; }
    .pill { background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.14); padding: 6px 12px; border-radius: 8px; }
    canvas { border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; background: #374151; max-width: 96vw; max-height: 82vh; }
    .help { margin-top: 8px; font-size: 12px; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="pill">Archipelago Drift · <span id="status">READY</span></div>
    <div class="pill">HP: <span id="hp">100</span> · Shards: <span id="shards">0/8</span> · Score: <span id="score">0</span></div>
  </div>
  <canvas id="game" width="720" height="440"></canvas>
  <div class="help">WASD / Arrows Move · Shift / Space Dash Parry · Collect all shards then reach the emerald Gate!</div>
  <script>
    const CFG = {"title":"Archipelago Drift","genre":"3D Arcade Racing","skyHex":"#111827","groundHex":"#374151","accentHex":"#38BDF8","hazardHex":"#EF4444","nominalHex":"#10B981","moveSpeed":10.5,"enemySpeed":4.2,"shardCount":8};
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    const player = { x: 360, y: 360, r: 14, hp: 100, dash: 0, cd: 0, inv: 0, score: 0 };
    const gate = { x: 360, y: 56, r: 22 };
    const shards = Array.from({ length: CFG.shardCount }, (_, i) => ({
      x: 110 + ((i * 117) % 500),
      y: 110 + (Math.floor(i / 2) * 85),
      got: false
    }));
    const enemies = [
      { x: 160, y: 180, speed: CFG.enemySpeed * 28 },
      { x: 560, y: 180, speed: CFG.enemySpeed * 26 },
    ];
    let state = 'PLAYING';
    let last = performance.now();

    function step(now) {
      const dt = Math.min(0.033, Math.max(0.016, (now - last) / 1000));
      last = now;
      if (state === 'PLAYING') {
        let dx = 0, dy = 0;
        if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
        const len = Math.hypot(dx, dy) || 1;
        player.cd = Math.max(0, player.cd - dt);
        player.inv = Math.max(0, player.inv - dt);
        if ((keys['ShiftLeft'] || keys['Space']) && player.cd <= 0) { player.dash = 0.16; player.cd = 0.65; }
        const spd = (player.dash > 0 ? CFG.moveSpeed * 2.1 : CFG.moveSpeed) * 28;
        if (player.dash > 0) player.dash -= dt;
        player.x = Math.max(24, Math.min(696, player.x + (dx / len) * spd * dt));
        player.y = Math.max(24, Math.min(416, player.y + (dy / len) * spd * dt));
        shards.forEach(s => {
          if (!s.got && Math.hypot(s.x - player.x, s.y - player.y) < 24) { s.got = true; player.score += 200; }
        });
        const gotCount = shards.filter(s => s.got).length;
        enemies.forEach(en => {
          const vx = player.x - en.x, vy = player.y - en.y, d = Math.hypot(vx, vy) || 1;
          en.x += (vx / d) * en.speed * dt;
          en.y += (vy / d) * en.speed * dt;
          if (d < 24 && player.inv <= 0 && player.dash <= 0) {
            player.hp = Math.max(0, player.hp - 15);
            player.inv = 0.8;
            if (player.hp <= 0) state = 'GAME OVER';
          }
        });
        if (gotCount >= CFG.shardCount && Math.hypot(gate.x - player.x, gate.y - player.y) < 30) {
          state = 'VICTORY!';
          player.score += 500;
        }
        document.getElementById('hp').textContent = String(player.hp);
        document.getElementById('shards').textContent = gotCount + '/' + CFG.shardCount;
        document.getElementById('score').textContent = String(player.score);
        document.getElementById('status').textContent = state;
      }

      ctx.fillStyle = CFG.skyHex;
      ctx.fillRect(0, 0, 720, 440);
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      for (let x = 0; x < 720; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 440); ctx.stroke(); }

      const allGot = shards.every(s => s.got);
      ctx.beginPath();
      ctx.arc(gate.x, gate.y, gate.r, 0, Math.PI * 2);
      ctx.fillStyle = allGot ? CFG.nominalHex : '#475569';
      ctx.fill();

      shards.forEach(s => {
        if (s.got) return;
        ctx.fillStyle = CFG.accentHex;
        ctx.beginPath(); ctx.arc(s.x, s.y, 9, 0, Math.PI * 2); ctx.fill();
      });
      enemies.forEach(en => {
        ctx.fillStyle = CFG.hazardHex;
        ctx.beginPath(); ctx.arc(en.x, en.y, 12, 0, Math.PI * 2); ctx.fill();
      });
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  </script>
</body>
</html>
