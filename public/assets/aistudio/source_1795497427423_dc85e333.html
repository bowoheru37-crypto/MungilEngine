    max-width: 1024px;
  }
}

@media (min-width: 1280px) {
  .container {
    max-width: 1280px;
  }
}

@media (min-width: 1536px) {
  .container {
    max-width: 1536px;
  }
}

.visible {
  visibility: visible;
}

.collapse {
  visibility: collapse;
}

.static {
  position: static;
}

.fixed {
  position: fixed;
}

.absolute {
  position: absolute;
}

.relative {
  position: relative;
}

.sticky {
  position: sticky;
}

.left-60 {
  left: 15rem;
}

.top-60 {
  top: 15rem;
}

.block {
  display: block;
}

.inline-block {
  display: inline-block;
}

.flex {
  display: flex;
}

.table {
  display: table;
}

.\!grid {
  display: grid !important;
}

.grid {
  display: grid;
}

.hidden {
  display: none;
}

.transform {
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.resize {
  resize: both;
}

.border {
  border-width: 1px;
}

.p-1 {
  padding: 0.25rem;
}

.shadow {
  --tw-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 1px 3px 0 var(--tw-shadow-color), 0 1px 2px -1px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.outline {
  outline-style: solid;
}

.blur {
  --tw-blur: blur(8px);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.transition {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --bg:#f4f6f4;
  --surface:#ffffff;
  --surface2:#eef1ee;
  --line:#d8ded8;
  --text:#17201a;
  --muted:#66706a;
  --accent:#16a34a;
  --accent2:#2563eb;
  --accent-ink:#ffffff;
  --danger:#dc2626;
  --gold:#eab308;
  --shadow:0 8px 24px rgba(20,35,25,.10);
  --radius:12px;
  --font-size:14px;
}

[data-theme="dark"]{
  --bg:#121212;
  --surface:#1c1c1c;
  --surface2:#262626;
  --line:#3a3a3a;
  --text:#ffffff;
  --muted:#b8b8b8;
  --accent:#3ddc78;
  --accent2:#60a5fa;
  --accent-ink:#07120a;
  --danger:#ff6b6b;
  --gold:#ffd43b;
  --shadow:0 8px 24px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;
  font-size:var(--font-size)
}

button,input,select,textarea{
  font:inherit
}

button{
  min-height:44px;
  border:0;
  border-radius:12px;
  cursor:pointer;
  background:var(--surface2);
  color:var(--text);
  padding:10px 12px;
  font-weight:700
}

button:active{
  transform:scale(.97);
  opacity:.88
}

button.primary{
  background:var(--accent);
  color:var(--accent-ink)
}

button.blue{
  background:var(--accent2);
  color:white
}

button.ghost{
  background:transparent;
  border:1px solid var(--line)
}

input[type=range]{
  width:100%;
  accent-color:var(--accent)
}

input[type=text],input[type=number],select,textarea{
  width:100%;
  min-height:44px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:9px 11px;
  background:var(--surface);
  color:var(--text)
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:var(--shadow);
  padding:14px
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--surface2);
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  font-weight:700
}

.small{
  font-size:12px;
  color:var(--muted)
}

h1{
  font-size:16px;
  line-height:1.2;
  margin:0
}

h2{
  font-size:16px;
  margin:0 0 8px
}

h3{
  font-size:14px;
  margin:10px 0 6px
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap
}

.col{
  display:flex;
  flex-direction:column;
  gap:8px
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}

.bar{
  height:10px;
  background:var(--surface2);
  border-radius:999px;
  overflow:hidden;
  border:1px solid var(--line)
}

.bar>i{
  display:block;
  height:100%;
  background:var(--accent);
  transition:width .2s
}

canvas{
  max-width:100%;
  height:auto;
  display:block;
  border-radius:12px;
  background:#0b1b2b
}

a{
  color:var(--accent2)
}

.tabbtn{
  flex:1;
  min-width:0;
  padding:8px 2px;
  font-size:11px;
  line-height:1.1;
  background:transparent;
  border-radius:12px
}

.tabbtn.on{
  background:var(--accent);
  color:var(--accent-ink)
}

.pill{
  font-size:11px;
  padding:4px 8px;
  border-radius:999px;
  background:var(--surface2);
  border:1px solid var(--line)
}

@media(max-width:520px){
  .grid2{
    grid-template-columns:1fr 1fr
  }

  .grid3{
    grid-template-columns:repeat(3,1fr)
  }
}
